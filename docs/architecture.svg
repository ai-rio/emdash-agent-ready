,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">agent/portfolio.ts       MCP and A2A answers</text><text x="568" y="376" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">utils/site-content.ts    llms.txt, cards, skills</text><text x="24" y="432" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="10" font-weight="400" fill="#5c5953" letter-spacing="1" text-anchor="start">02</text><text x="48" y="432" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="10" font-weight="400" fill="#121212" letter-spacing="1" text-anchor="start">CMS</text><rect x="168" y="408" width="768" height="64" fill="none" stroke="#b9b6af" stroke-width="1"/><text x="184" y="432" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#121212" letter-spacing="0" text-anchor="start">EmDash</text><text x="184" y="454" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">Admin at /_emdash/admin   |   schema and demo content in seed/seed.json   |   per-locale entries</text><text x="24" y="512" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="10" font-weight="400" fill="#5c5953" letter-spacing="1" text-anchor="start">01</text><text x="48" y="512" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="10" font-weight="400" fill="#121212" letter-spacing="1" text-anchor="start">STORAGE</text><rect x="168" y="488" width="384" height="64" fill="none" stroke="#b9b6af" stroke-width="1"/><text x="184" y="512" font-fami