<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" width="960" height="576" role="img" aria-labelledby="architecture-title architecture-desc"><title id="architecture-title">emdash-agent-ready layers</title><desc id="architecture-desc">People use web pages and AI agents use the agent layer; both read content from EmDash, stored in Cloudflare D1 and R2, running as an Astro site on a Cloudflare Worker.</desc><rect width="960" height="576" fill="#f3f2ee"/><text x="24" y="32" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#121212" letter-spacing="0" text-anchor="start">emdash-agent-ready</text><text x="936" y="32" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="end">One content source, two audiences</text><text x="24" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="10" font-weight="400" fill="#5c5953" letter-spacing="1" text-anchor="start">05</text><text x="48" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="10" font-weight="400" fill="#121212" letter-spacing="1" text-anchor="start">CLIENTS</text><rect x="168" y="56" width="384" height="56" fill="none" stroke="#b9b6af" stroke-width="1"/><text x="184" y="80" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#121212" letter-spacing="0" text-anchor="start">People</text><text x="184" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">Browsers</text><rect x="552" y="56" width="384" height="56" fill="none" stroke="#b9b6af" stroke-width="1"/><text x="568" y="80" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#121212" letter-spacing="0" text-anchor="start">AI agents and crawlers</text><text x="568" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">MCP and A2A clients, search and answer bots</text><text x="24" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="10" font-weight="400" fill="#5c5953" letter-spacing="1" text-anchor="start">04</text><text x="48" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="10" font-weight="400" fill="#121212" letter-spacing="1" text-anchor="start">INTERFACES</text><rect x="168" y="128" width="384" height="168" fill="none" stroke="#b9b6af" stroke-width="1"/><text x="184" y="152" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#121212" letter-spacing="0" text-anchor="start">Web pages</text><text x="184" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">/  /work  /work/:slug  /:slug  /rss.xml</text><text x="184" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">English, /pt-br, /es</text><text x="184" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">Language redirect on /  (middleware)</text><text x="184" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">JSON-LD, sitemap, FAQ block</text><text x="184" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">Theme switcher</text><rect x="552" y="128" width="384" height="168" fill="#bf452012" stroke="#bf4520" stroke-width="1"/><text x="568" y="152" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#bf4520" letter-spacing="0" text-anchor="start">Agent layer</text><text x="568" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">/mcp            5 read-only tools</text><text x="568" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">/a2a            retrieval-only concierge</text><text x="568" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">/.well-known/*  cards, API catalog, skills</text><text x="568" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">/llms.txt  /llms-full.txt  /robots.txt</text><text x="568" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">Accept: text/markdown on content pages</text><text x="568" y="264" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" style="white-space:pre" font-size="11" font-weight="400" fill="#5c5953" letter-spacing="0" text-anchor="start">WebMCP 